name: LinkedIn board-discovery leads

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch: {}

concurrency:
  group: linkedin-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci --no-audit --no-fund
      - run: pip install python-jobspy

      # LinkedIn's guest jobs-guest endpoint rate-limits/blocks by IP harder
      # than any other board jobspy hits (confirmed in jobfeed/README.md) —
      # same reason HiringCafe/NextPlay route through the user's residential
      # connection instead of GitHub's datacenter IP range.
      - name: Connect to Tailscale exit node
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: "--exit-node=100.108.228.9 --exit-node-allow-lan-access=false"

      # Only 6 short, courtesy-delayed queries per run (see DEFAULT_QUERIES
      # in fetch-linkedin-feed.py). Dialed back 30min->2h on 2026-10-28:
      # confirmed live via scan-linkedin-heartbeat.json history that the
      # 30-minute cadence got this exit node soft-blocked by LinkedIn for
      # ~14 hours straight (every query returning 0 rows with zero HTTP
      # errors — jobspy doesn't surface a block as an exception, just an
      # empty result set, which fetch-linkedin-feed.py's zero-leads guard
      # now also catches regardless of whether errors were reported). This
      # runs through the user's own residential IP (via Tailscale), so an
      # IP-level block here also hits their normal LinkedIn browsing.
      #
      # --results dropped 25->12 on 2026-10-28 when linkedin_fetch_description
      # was turned on in fetch-linkedin-feed.py: that flag costs ONE EXTRA
      # REQUEST PER JOB (to get job_url_direct, the real employer apply
      # link — without it the url is always a linkedin.com page that can
      # never resolve to a known ATS board, which is why resolvedToKnownAts
      # had been 0 on every run since this script existed). 12 results x 6
      # queries = up to 72 extra detail-page fetches per run; watch
      # scan-linkedin-heartbeat.json's elapsedSec and errors after this
      # change — raise --results back up only if it stays reliable.
      - name: Run LinkedIn lead fetch
        run: python3 fetch-linkedin-feed.py --results 12 --hours 24 --sleep 10

      - name: Disconnect from Tailscale exit node
        run: sudo tailscale down || true

      - name: Run board discovery (promote any ATS-hosted LinkedIn leads)
        run: node discover-boards.mjs

      - name: Commit results
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ portals.yml
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "linkedin: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            pushed=0
            for attempt in 1 2 3; do
              git rebase --abort >/dev/null 2>&1 || true
              if git pull --rebase --quiet && git push; then
                pushed=1
                break
              fi
              echo "push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push scan results after 3 attempts"
              exit 1
            fi
          fi
