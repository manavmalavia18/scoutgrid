name: Wellfound board-discovery leads

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch: {}

concurrency:
  group: wellfound-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      # No login wall, no Cloudflare challenge on wellfound.com's public
      # search pages (confirmed via plain curl with a normal browser UA) —
      # unlike NextPlay/HiringCafe this does NOT need the Tailscale exit
      # node. If GitHub's datacenter IP range later gets blocked (same
      # failure mode NextPlay hit), add the exit-node step here to match.
      - name: Run Wellfound lead fetch
        run: node fetch-wellfound-feed.mjs --pages 2

      - name: Commit results
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          # Publish only this workflow's outputs onto current main;
          # never recommit an old checkout's unrelated files.
          bash scripts/push-owned-snapshot.sh wellfound data/wellfound-feed.json data/scan-wellfound-heartbeat.json
