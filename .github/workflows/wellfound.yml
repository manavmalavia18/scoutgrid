name: Wellfound board-discovery leads

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch: {}

concurrency:
  group: wellfound-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      # No login wall, no Cloudflare challenge on wellfound.com's public
      # search pages (confirmed via plain curl with a normal browser UA) —
      # unlike NextPlay/HiringCafe this does NOT need the Tailscale exit
      # node. If GitHub's datacenter IP range later gets blocked (same
      # failure mode NextPlay hit), add the exit-node step here to match.
      - name: Run Wellfound lead fetch
        run: node fetch-wellfound-feed.mjs --pages 2

      - name: Commit results
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            pushed=0
            # This workflow writes exclusively to its own dedicated feed
            # file (no other workflow touches it), and each run is a
            # complete fresh snapshot, not an incremental edit -- a
            # textual rebase between two concurrent runs conflicts almost
            # every time regardless of retry count (confirmed live
            # 2026-11-12 on hc.yml's near-identical file). Instead: fetch
            # latest and move the branch pointer onto it (soft reset),
            # then recommit -- this run's freshly-fetched data always
            # wins for its own files, no line-level merge needed.
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main --quiet
              git reset --soft origin/main
              git commit -m "wellfound: $(date -u +%Y-%m-%dT%H:%M:%SZ)" --quiet
              if git push; then
                pushed=1
                break
              fi
              backoff=$((attempt * 8))
              echo "push attempt $attempt failed, retrying in ${backoff}s..."
              sleep $backoff
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push scan results after 8 attempts"
              exit 1
            fi
          fi
