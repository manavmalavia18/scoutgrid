name: HiringCafe feed — data roles (via Tailscale exit node)

on:
  schedule:
    # Dialed back 15min->45min on 2026-11-12, same reason/fix as hc.yml --
    # HiringCafe started Cloudflare-challenging every single query, 100%
    # fail rate for ~2 days, likely cumulative IP-reputation decay on the
    # shared Tailscale exit node from all 4 workflows routing through it.
    - cron: '6-59/45 * * * *'
  workflow_dispatch: {}

concurrency:
  group: hc-data-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    # Patchright/Xvfb became unreliable when ubuntu-latest started migrating
    # to Ubuntu 26 on 2026-10-19. Keep this browser workflow on the known-good
    # image until Patchright explicitly supports the newer runner.
    runs-on: ubuntu-24.04
    # Full HC runs can take 12+ minutes before commit/push; 13 minutes caused
    # valid scrapes to be cancelled at the job boundary. Bumped 25->30 since
    # the 25min budget also has to cover checkout/npm ci/patchright+Xvfb
    # install/Tailscale connect+disconnect/commit-with-3-retries on top of
    # the scrape itself — the scrape's own worst-case budget (queries x
    # 60s patchright timeout, see fetch-hiringcafe-feed.mjs) is ~17min alone.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci --no-audit --no-fund

      - name: Install patchright + Xvfb
        run: |
          pip install patchright
          # apt/npm mirrors (azure.archive.ubuntu.com etc.) occasionally
          # have transient DNS/availability blips on GitHub's runners --
          # retry a few times with backoff instead of failing the whole
          # job outright. Confirmed live 2026-11-11: "Temporary failure
          # resolving 'azure.archive.ubuntu.com'" killed 2 consecutive
          # runs 15 minutes apart.
          for attempt in 1 2 3 4; do
            if python3 -m patchright install chromium --with-deps; then
              break
            fi
            echo "patchright install attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          sudo apt-get update -y && sudo apt-get install -y xvfb

      - name: Connect to Tailscale exit node
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: "--exit-node=100.108.228.9 --exit-node-allow-lan-access=false"

      - name: Run HiringCafe feed fetch for data roles (under Xvfb)
        id: scrape
        continue-on-error: true
        # --hours 96 decouples local merge retention from the search
        # query's day-window: a sustained outage (like the 2026-11-12
        # Cloudflare-challenge one) shouldn't wipe the feed to zero once
        # retention lapses. See hc.yml for the full rationale.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node run-hc.mjs --hours 96
        env:
          HC_PYTHON: python3
          HC_OUT: data/hiringcafe-feed-data.json
          HC_HITS_TMP: data/hc-hits-data.tmp.json
          HC_HEARTBEAT: data/scan-hc-heartbeat-data.json
          HC_LOCK: data/hc-feed-data.lock
          # Distinct Chrome profile from hc.yml's software track — sharing
          # one would silently race for patchright's SingletonLock the
          # moment the two tracks' schedules (or a manual dispatch) overlap.
          HC_PROFILE: data/hiringcafe-profile-data
          # No hardcoded query list — inherits DEFAULT_DATA_QUERIES from
          # lib/data-query.mjs once run-hc.mjs is pointed at it (see
          # fetch-hiringcafe-feed.mjs's HC_QUERIES fallback). Until that
          # wiring lands, this workflow sets the list explicitly so it
          # doesn't silently fall back to the software-role defaults.
          #
          # "data engineer" and "machine learning engineer" are deliberately
          # DROPPED from this list (2026-11-13): hc.yml's software track
          # requests the exact same two query strings against the exact
          # same fixed searchState filters (locations/days/departments/
          # roleTypes/seniority/clearances — see fetch-hiringcafe-feed.mjs's
          # searchState()), so HiringCafe would return a byte-for-byte
          # identical response to this track re-requesting them. Coverage
          # for these two terms is restored below via HC_REUSE_FEED_FROM,
          # which pulls them out of hc.yml's already-published feed instead
          # of a second live request. See lib/hc-reuse-feed.mjs.
          HC_QUERIES: "data analyst|data scientist|etl developer|power bi developer|database administrator|business intelligence engineer|business intelligence analyst|analytics engineer|ai ml engineer|data warehouse engineer|product analyst"
          # Reuse hc.yml's already-published feed for the two query strings
          # dropped above — never a live second request, and never counted
          # toward this track's own live pagesFetched/failedQueries health
          # signals (see fetch-hiringcafe-feed.mjs: reuse happens strictly
          # after assessHiringCafeScan() has already judged THIS track's own
          # live fetch healthy, so a blocked cycle here is never masked as
          # successful just because hc.yml's feed has old data sitting
          # around).
          HC_REUSE_FEED_FROM: data/hiringcafe-feed.json

      - name: Disconnect from Tailscale exit node
        if: always()
        # GitHub became unreachable through the residential exit node after
        # long scrapes (DNS: "Could not resolve host: github.com"). Restore the
        # runner's normal network before git pull/push.
        run: sudo tailscale down || true

      - name: Commit results
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          # Publish only this workflow's outputs onto current main;
          # never recommit an old checkout's unrelated files.
          bash scripts/push-owned-snapshot.sh hc-data data/hiringcafe-feed-data.json data/scan-hc-heartbeat-data.json

      - name: Publish failed heartbeat without overwriting the feed
        if: always() && steps.scrape.outcome == 'failure'
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          bash scripts/push-owned-snapshot.sh hc-data-failure data/scan-hc-heartbeat-data.json

      - name: Mark unavailable scan as failed
        if: always() && steps.scrape.outcome == 'failure'
        run: exit 1
