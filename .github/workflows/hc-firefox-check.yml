name: Temporary HiringCafe Firefox connectivity check

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unmodified Firefox via Playwright
        run: |
          python3 -m pip install 'playwright==1.58.0'
          python3 -m playwright install --with-deps firefox
      - name: Connect to same Tailscale exit node as current HC scraper
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: '--exit-node=100.108.228.9 --exit-node-allow-lan-access=false'
      - name: One ordinary browser visit; do not solve challenges or crawl listings
        run: |
          python3 - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.firefox.launch(headless=True)
              page = browser.new_page()
              try:
                  response = page.goto('https://hiringcafe.com/jobs', wait_until='domcontentloaded', timeout=30000)
                  title = page.title()
                  body = page.locator('body').inner_text(timeout=5000)[:300]
                  result = {
                      'browser': 'firefox-default',
                      'url': page.url,
                      'status': response.status if response else None,
                      'title': title,
                      'has_next_data': page.locator('#__NEXT_DATA__').count() > 0,
                      'cloudflare_challenge': title.strip().lower() == 'just a moment...' or 'checking your browser' in body.lower(),
                  }
                  print(json.dumps(result))
              finally:
                  browser.close()
          PY
      - name: Disconnect from Tailscale
        if: always()
        run: sudo tailscale down || true
