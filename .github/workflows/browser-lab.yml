name: Browser runtime lab (local fixture only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  local-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated, pinned lab dependencies
        run: npm ci --prefix browser-lab --ignore-scripts --no-audit --no-fund
      - name: Install system libraries and standard Chromium
        run: |
          browser-lab/node_modules/.bin/playwright-core install-deps chromium
          browser-lab/node_modules/.bin/playwright-core install chromium
      - name: Install Python Playwright client (CDP interop experiment only)
        # Deliberately plain `playwright`, not `patchright` — this is a
        # generic cross-language protocol experiment, isolated to
        # browser-lab/, independent of the production scraper's patchright
        # dependency. No browser install needed here: connect_over_cdp()
        # only needs the driver/client library, not a bundled browser.
        run: pip install playwright
      - name: Unit tests for adapter and page diagnostics
        run: node --test test/browser-lab-*.test.mjs
      - name: Standard Playwright on loopback fixture
        id: playwright
        run: |
          set +e
          output=$(BROWSER_LAB_RUNTIME=playwright node browser-lab/smoke.mjs)
          status=$?
          set -e
          printf '%s\n' "$output"
          printf '%s\n' "$output" > "$RUNNER_TEMP/playwright.json"
          echo "$status" > "$RUNNER_TEMP/playwright.exit"
          echo "exit_code=$status"
          exit "$status"
      - name: Strict CloakBrowser preflight (license, binary, install, launch)
        id: preflight
        env:
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
        run: |
          set +e
          node browser-lab/preflight.mjs > "$RUNNER_TEMP/preflight.json"
          status=$?
          set -e
          cat "$RUNNER_TEMP/preflight.json"
          echo "exit_code=$status"
          # preflight.mjs itself already wrote available=/status= to
          # $GITHUB_OUTPUT (it reads GITHUB_OUTPUT directly) and exits 0 for
          # both "ok" and the expected no-secret "license_missing" case —
          # only a real binary_missing/install_failed/launch_failed exits
          # non-zero here, which this step surfaces without failing the job
          # (the later steps/summary decide what to do with it).
          exit 0
      - name: CloakBrowser on same loopback fixture (only when preflight is ok)
        id: cloak
        if: steps.preflight.outputs.status == 'ok'
        env:
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
        run: |
          set +e
          output=$(BROWSER_LAB_RUNTIME=cloakbrowser node browser-lab/smoke.mjs)
          status=$?
          printf '%s\n' "$output"
          printf '%s\n' "$output" > "$RUNNER_TEMP/cloakbrowser.json"
          echo "$status" > "$RUNNER_TEMP/cloakbrowser.exit"
          echo "exit_code=$status"
          exit "$status"
      - name: Search-page-shaped fixture compatibility check (only when preflight is ok)
        id: compat
        if: steps.preflight.outputs.status == 'ok'
        env:
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
        run: node --test test/browser-lab-hc-shaped-compat.test.mjs
      - name: Node-to-Python CDP interop experiment (only when preflight is ok)
        id: cdp-interop
        if: steps.preflight.outputs.status == 'ok'
        env:
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
        run: node --test test/browser-lab-cdp-interop.test.mjs
      - name: Summarize runtime comparison
        if: always()
        env:
          CLOAK_AVAILABLE: ${{ steps.preflight.outputs.status == 'ok' }}
          CLOAK_PREFLIGHT_STATUS: ${{ steps.preflight.outputs.status }}
        run: node browser-lab/report.mjs
      - name: Fail the job on a real preflight failure (not a missing license)
        if: always() && steps.preflight.outputs.status != 'ok' && steps.preflight.outputs.status != 'license_missing'
        run: |
          echo "CloakBrowser preflight failed with status '${{ steps.preflight.outputs.status }}' while a license secret IS configured — see the preflight JSON above."
          exit 1
