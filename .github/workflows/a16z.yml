name: a16z portfolio board-discovery leads

on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: a16z-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      # jobs.a16z.com's company-level listing pages (jobs.a16z.com/jobs/<slug>)
      # are plain server-rendered HTML — confirmed no login wall, no JS
      # execution needed, no Cloudflare challenge via a normal browser UA.
      # Unlike LinkedIn/HiringCafe this does NOT need the Tailscale exit
      # node. ~673 companies at a 250ms courtesy delay each (see
      # fetch-a16z-feed.mjs) takes a few minutes — 6-hour cadence is plenty
      # since the portfolio company list itself barely changes day to day.
      - name: Run a16z portfolio lead fetch
        run: node fetch-a16z-feed.mjs

      # Promotion to official-board-registry.json is left to the dedicated
      # board-discovery.yml workflow (runs every 30min on its own schedule
      # and reads this same data/a16z-feed.json). Used to call
      # discover-boards.mjs here too for immediate promotion, but that
      # meant TWO workflows writing the same shared registry/heartbeat
      # files -- a collision that kept losing even an 8-attempt/64s-backoff
      # retry (confirmed live 2026-11-11, board-discovery was committing
      # more often than that whole retry window). 30min of extra lead-time
      # before promotion is a non-issue for a feed this low-frequency (runs
      # every 6h) -- removing the duplicate write eliminates the race
      # outright instead of racing against it.

      - name: Commit results
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ portals.yml
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "a16z: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            pushed=0
            # 8 attempts with real backoff (was 3 at a flat 5s) -- several
            # workflows (a16z/board-discovery/linkedin/wellfound/etc.) write
            # to the same shared data/official-board-registry.json via
            # discover-boards.mjs and collide often enough that 3 quick
            # attempts routinely lost the race. Confirmed live 2026-11-09.
            for attempt in 1 2 3 4 5 6 7 8; do
              git rebase --abort >/dev/null 2>&1 || true
              if git pull --rebase --quiet && git push; then
                pushed=1
                break
              fi
              backoff=$((attempt * 8))
              echo "push attempt $attempt failed, retrying in ${backoff}s..."
              sleep $backoff
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push scan results after 8 attempts"
              exit 1
            fi
          fi
