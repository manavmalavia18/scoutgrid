name: JobRight (via Tailscale exit node)

on:
  schedule:
    - cron: '7-59/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: jobright-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    # Patchright/Xvfb became unreliable when ubuntu-latest started migrating
    # to Ubuntu 26 on 2026-10-19 — same fix applied to hc.yml/hc-data.yml.
    runs-on: ubuntu-24.04
    # Was 13min, same tight-margin issue fixed elsewhere — gives headroom
    # for a slow Tailscale-relayed scrape + 3-attempt push retry.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci --no-audit --no-fund

      - name: Install scrapling + patchright chromium
        run: |
          # Upper-pinned: scrapling 0.5 (2026-10-27) removed the capture_xhr
          # fetch param scrape-jobright.py depends on ("capture_xhr was
          # removed; use record_requests=True and session.network"), which
          # broke every jr-board fetch and stalled this feed. Pin below 0.5
          # until scrape-jobright.py is migrated to the new NetworkRecorder
          # API (session.network.search(...) instead of page.captured_xhr).
          pip install 'scrapling[fetchers]>=0.4.13,<0.5'
          # apt mirrors (azure.archive.ubuntu.com etc.) occasionally have
          # transient DNS/availability blips on GitHub's runners -- retry
          # a few times with backoff instead of failing the whole job.
          # Confirmed live 2026-11-11: "Temporary failure resolving
          # 'azure.archive.ubuntu.com'" killed 2 consecutive runs.
          for attempt in 1 2 3 4; do
            if python3 -m patchright install chromium --with-deps; then
              break
            fi
            echo "patchright install attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done

      # Cookie-based auth (JOBRIGHT_COOKIE secret, captured once from the
      # user's own logged-in session — never a password) runs headless per
      # scrape-jobright.py, so no Xvfb needed here unlike HC.
      - name: Connect to Tailscale exit node
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: "--exit-node=100.108.228.9 --exit-node-allow-lan-access=false"

      - name: Run JobRight feed fetch
        run: node run-jobright.mjs
        env:
          JOBRIGHT_COOKIE: ${{ secrets.JOBRIGHT_COOKIE }}
          HC_PYTHON: python3

      - name: Disconnect from Tailscale exit node
        # GitHub became unreachable through the residential exit node after
        # long scrapes (DNS: "Could not resolve host: github.com") — same
        # fix already applied to hc.yml/hc-data.yml/linkedin.yml; this
        # workflow never had it, which was silently failing every push.
        run: sudo tailscale down || true

      - name: Commit results
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          # Publish only this workflow's outputs onto current main;
          # never recommit an old checkout's unrelated files.
          bash scripts/push-owned-snapshot.sh jobright data/jr-board-fresh.json data/jr-companies.json data/scan-jr-heartbeat.json
