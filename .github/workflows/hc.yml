name: HiringCafe feed (self-hosted Mac runner)

on:
  schedule:
    # Back to 15min (was dialed back to 45min on 2026-11-12 after HiringCafe
    # 100%-challenged every query for ~2 days on the Tailscale exit node).
    # Restored to 15min on 2026-11-16 at the user's explicit request, now
    # that this runs on the self-hosted Mac runner's own residential IP
    # instead of the shared, higher-volume Tailscale exit node — same
    # mechanism that triggered the earlier block is still live (today's
    # test run got a real 403 from manual-testing volume on this same IP,
    # self-cleared in ~15min), so a sustained high-volume stretch can still
    # trigger a multi-day block again. Offset :01/:56 so this and
    # hc-data.yml's :08/:53 never launch Chrome at the same moment.
    - cron: '1-59/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: hc-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    # Moved to a self-hosted runner on 2026-11-16: this machine's own
    # residential IP is what was actually getting through HiringCafe's
    # Cloudflare block (confirmed via real local hc-local.sh runs), unlike
    # the GitHub-hosted runner's datacenter IP range (hard 403, every
    # query, since 2026-11-06) or the shared Tailscale exit node (which
    # degraded from cumulative reputation decay shared with
    # NextPlay/LinkedIn/JobRight). No Tailscale/Xvfb steps needed below:
    # the runner has its own real network path and a real display already.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No actions/setup-python here — unlike the GitHub-hosted runner this
      # replaced, this self-hosted Mac already has a working system python3
      # with patchright pre-installed persistently, and setup-python@v5
      # fails on it: it assumes the GitHub-hosted macOS runner's hardcoded
      # home dir (/Users/runner) for its tool-cache, which doesn't exist on
      # this machine ("mkdir: /Users/runner: Permission denied" — confirmed
      # live on run 43903966121).

      - run: npm ci --no-audit --no-fund

      - name: Install patchright + Chromium
        # No Xvfb/--with-deps here — those were Linux-runner-only (no real
        # display, needed apt packages). This runner has a real macOS
        # display, and patchright caches the Chromium download under
        # ~/Library/Caches/ms-playwright (persistent across runs on this
        # same machine), so after the first run this step is just a
        # fast no-op version check.
        run: |
          pip install patchright
          python3 -m patchright install chromium

      - name: Run HiringCafe feed fetch
        id: scrape
        continue-on-error: true
        # --hours 96 (was defaulting to --days*24=48) decouples local merge
        # retention from the search query's day-window: a sustained outage
        # like the 2026-11-12 Cloudflare-challenge one shouldn't wipe the
        # whole feed down to zero once the retention window lapses. Each
        # job's own posted_at still drives dashboard freshness bucketing
        # independently, so this only affects how long a stale-feed outage
        # can run before genuinely-old jobs get dropped, not what looks
        # "fresh" to the user.
        run: node run-hc.mjs --hours 96
        env:
          HC_PYTHON: python3
          # Explicit default profile (same value fetch-hiringcafe-feed.mjs
          # falls back to without this) — named here so it's visible
          # alongside hc-data.yml's distinct HC_PROFILE, since the two
          # tracks sharing one would silently race for patchright's
          # SingletonLock the moment their schedules (or a manual dispatch)
          # overlap. This is a workspace-relative path, distinct from
          # hc-local.sh's ~/.scoutgrid-local profiles, so an interactive
          # manual hc-local.sh run never races this scheduled CI run either.
          HC_PROFILE: data/hiringcafe-profile
          # Same local-disruption fix hc-local.sh uses: run every query
          # through ONE Chrome window instead of relaunching per query.
          # Was CI-irrelevant under Xvfb (no real screen to disturb), but
          # now that this runs on the user's own Mac with a real display,
          # it matters here too — see fetchViaPatchrightBatch()'s docstring
          # in fetch-hiringcafe-feed.mjs.
          HC_SINGLE_SESSION: "1"
          # No HC_QUERIES override — inherit DEFAULT_HIRINGCAFE_QUERIES from
          # lib/hiringcafe-query.mjs so broadening the role list in code
          # actually takes effect here instead of being silently pinned to
          # whatever a one-time override says.

      - name: Commit results
        if: steps.scrape.outcome == 'success'
        # GITHUB_TOKEN explicit here (not just relying on checkout's state)
        # — see push-owned-snapshot.sh's comment for why this self-hosted
        # runner needs it passed explicitly.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          # Publish only this workflow's outputs onto current main;
          # never recommit an old checkout's unrelated files.
          bash scripts/push-owned-snapshot.sh hc data/hiringcafe-feed.json data/scan-hc-heartbeat.json

      - name: Publish failed heartbeat without overwriting the feed
        if: always() && steps.scrape.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          bash scripts/push-owned-snapshot.sh hc-failure data/scan-hc-heartbeat.json

      - name: Mark unavailable scan as failed
        if: always() && steps.scrape.outcome == 'failure'
        run: exit 1
