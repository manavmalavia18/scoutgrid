name: HiringCafe feed (via Tailscale exit node)

on:
  schedule:
    # Dialed back 15min->45min on 2026-11-12: HiringCafe started serving a
    # Cloudflare "Just a moment..." managed-challenge page to every single
    # query, 100% fail rate for ~2 days straight (confirmed via
    # hcTotals/queriesSkipped history). Likely cumulative IP-reputation
    # decay on the shared Tailscale exit node (100.108.228.9), which also
    # serves NextPlay/LinkedIn/JobRight — same root cause and same fix
    # that worked for LinkedIn's near-identical 2026-10-28 soft-block
    # (30min cadence -> 14h block -> throttled to 2h, cleared). Not
    # touching NextPlay/JobRight yet; revisit if this alone doesn't help.
    - cron: '11-59/45 * * * *'
  workflow_dispatch: {}

concurrency:
  group: hc-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    # Patchright/Xvfb became unreliable when ubuntu-latest started migrating
    # to Ubuntu 26 on 2026-10-19. Keep this browser workflow on the known-good
    # image until Patchright explicitly supports the newer runner.
    runs-on: ubuntu-24.04
    # Full HC runs can take 12+ minutes before commit/push; 13 minutes caused
    # valid scrapes to be cancelled at the job boundary. Bumped 25->30 since
    # the 25min budget also has to cover checkout/npm ci/patchright+Xvfb
    # install/Tailscale connect+disconnect/commit-with-3-retries on top of
    # the scrape itself — the scrape's own worst-case budget (16 queries x
    # 60s patchright timeout, see fetch-hiringcafe-feed.mjs) is ~17min alone.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci --no-audit --no-fund

      # Cloudflare blocks headless Chrome after ~1 page (same reason the
      # local scraper uses patchright "headed", not headless). GitHub's
      # Linux runners have no display at all, so a real Xvfb virtual
      # display is required to make patchright launch in headed mode here.
      - name: Install patchright + Xvfb
        run: |
          pip install patchright
          # apt/npm mirrors (azure.archive.ubuntu.com etc.) occasionally
          # have transient DNS/availability blips on GitHub's runners --
          # retry a few times with backoff instead of failing the whole
          # job outright. Confirmed live 2026-11-11: "Temporary failure
          # resolving 'azure.archive.ubuntu.com'" killed 2 consecutive
          # runs 15 minutes apart.
          for attempt in 1 2 3 4; do
            if python3 -m patchright install chromium --with-deps; then
              break
            fi
            echo "patchright install attempt $attempt failed, retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          sudo apt-get update -y && sudo apt-get install -y xvfb

      # Same IP-reputation problem as NextPlay, same fix: route through the
      # user's home connection via Tailscale exit node. Proven working.
      - name: Connect to Tailscale exit node
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: "--exit-node=100.108.228.9 --exit-node-allow-lan-access=false"

      - name: Run HiringCafe feed fetch (under Xvfb)
        # --hours 96 (was defaulting to --days*24=48) decouples local merge
        # retention from the search query's day-window: a sustained outage
        # like the 2026-11-12 Cloudflare-challenge one shouldn't wipe the
        # whole feed down to zero once the retention window lapses. Each
        # job's own posted_at still drives dashboard freshness bucketing
        # independently, so this only affects how long a stale-feed outage
        # can run before genuinely-old jobs get dropped, not what looks
        # "fresh" to the user.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node run-hc.mjs --hours 96
        env:
          HC_PYTHON: python3
          # No HC_QUERIES override — inherit DEFAULT_HIRINGCAFE_QUERIES from
          # lib/hiringcafe-query.mjs so broadening the role list in code
          # actually takes effect here instead of being silently pinned to
          # whatever a one-time override says.

      - name: Disconnect from Tailscale exit node
        # GitHub became unreachable through the residential exit node after
        # long scrapes (DNS: "Could not resolve host: github.com"). Restore the
        # runner's normal network before git pull/push.
        run: sudo tailscale down || true

      - name: Commit results
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            pushed=0
            # data/hiringcafe-feed.json is a complete fresh snapshot each
            # run, not an incremental edit -- a textual rebase between two
            # concurrent runs' versions of this file conflicts almost
            # every time (different listings/order), so retrying the exact
            # same rebase just repeats the same conflict. Confirmed live
            # 2026-11-12: 8 rebase retries over ~5min, same conflict every
            # time. Instead: fetch latest and move the branch pointer onto
            # it (soft reset), then recommit -- this run's freshly-fetched
            # data always wins for its own files, no line-level merge.
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main --quiet
              git reset --soft origin/main
              git commit -m "hc: $(date -u +%Y-%m-%dT%H:%M:%SZ)" --quiet
              if git push; then
                pushed=1
                break
              fi
              backoff=$((attempt * 8))
              echo "push attempt $attempt failed, retrying in ${backoff}s..."
              sleep $backoff
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push scan results after 8 attempts"
              exit 1
            fi
          fi
