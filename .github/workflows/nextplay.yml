name: NextPlay feed (via Tailscale exit node)

on:
  schedule:
    - cron: '3-59/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: nextplay-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      # hireascout's API 403s on GitHub's datacenter IP ranges (confirmed via
      # A/B test: identical code works from a home IP). Route this job's
      # traffic through the Mac's Tailscale exit node instead, so the
      # request looks like it's coming from a normal residential connection
      # — the compute still runs free on Actions, only the network path
      # changes. Nothing deceptive here: it's literally the user's own
      # internet connection, just relayed.
      - name: Connect to Tailscale exit node
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: "--exit-node=100.108.228.9 --exit-node-allow-lan-access=false"

      - name: Sanity-check exit IP before running the real fetch
        run: |
          echo "Outbound IP via exit node:"
          curl -s https://ifconfig.me || true
          echo

      - name: Run NextPlay feed fetch
        run: node run-nextplay.mjs

      - name: Commit results
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            pushed=0
            # This workflow writes exclusively to its own dedicated feed
            # file (no other workflow touches it), and each run is a
            # complete fresh snapshot, not an incremental edit -- a
            # textual rebase between two concurrent runs conflicts almost
            # every time regardless of retry count (confirmed live
            # 2026-11-12 on hc.yml's near-identical file). Instead: fetch
            # latest and move the branch pointer onto it (soft reset),
            # then recommit -- this run's freshly-fetched data always
            # wins for its own files, no line-level merge needed.
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main --quiet
              git reset --soft origin/main
              git commit -m "nextplay: $(date -u +%Y-%m-%dT%H:%M:%SZ)" --quiet
              if git push; then
                pushed=1
                break
              fi
              backoff=$((attempt * 8))
              echo "push attempt $attempt failed, retrying in ${backoff}s..."
              sleep $backoff
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push scan results after 8 attempts"
              exit 1
            fi
          fi
