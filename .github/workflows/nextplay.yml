name: NextPlay feed (via Tailscale exit node)

on:
  schedule:
    - cron: '3-59/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: nextplay-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      # hireascout's API 403s on GitHub's datacenter IP ranges (confirmed via
      # A/B test: identical code works from a home IP). Route this job's
      # traffic through the Mac's Tailscale exit node instead, so the
      # request looks like it's coming from a normal residential connection
      # — the compute still runs free on Actions, only the network path
      # changes. Nothing deceptive here: it's literally the user's own
      # internet connection, just relayed.
      - name: Connect to Tailscale exit node
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: "--exit-node=100.108.228.9 --exit-node-allow-lan-access=false"

      - name: Sanity-check exit IP before running the real fetch
        run: |
          echo "Outbound IP via exit node:"
          curl -s https://ifconfig.me || true
          echo

      - name: Run NextPlay feed fetch
        run: node run-nextplay.mjs

      - name: Commit results
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "nextplay: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            pushed=0
            # 8 attempts with real backoff (was 3 at a flat 5s) -- several
            # workflows (a16z/board-discovery/linkedin/wellfound/etc.) write
            # to the same shared data/official-board-registry.json via
            # discover-boards.mjs and collide often enough that 3 quick
            # attempts routinely lost the race. Confirmed live 2026-11-09.
            for attempt in 1 2 3 4 5 6 7 8; do
              git rebase --abort >/dev/null 2>&1 || true
              if git pull --rebase --quiet && git push; then
                pushed=1
                break
              fi
              backoff=$((attempt * 8))
              echo "push attempt $attempt failed, retrying in ${backoff}s..."
              sleep $backoff
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push scan results after 8 attempts"
              exit 1
            fi
          fi
