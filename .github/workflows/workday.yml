name: Workday reverse scan

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: workday-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Run Workday scan
        run: node run-workday.mjs
        env:
          WORKDAY_SINCE: '1'
      - name: Commit results
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          # Publish only this workflow's outputs onto current main;
          # never recommit an old checkout's unrelated files.
          bash scripts/push-owned-snapshot.sh workday data/cache/scan-dead-boards-workday.json data/pipeline-workday.md data/scan-history-workday.tsv data/scan-workday-heartbeat.json
