name: GHAL scan

on:
  schedule:
    # Every 5 minutes — this repo is PUBLIC, so GitHub Actions on standard
    # runners is completely free/unmetered here (no minute quota at all on
    # any plan for public repos). 5 min is GitHub's documented minimum
    # schedule granularity; going tighter doesn't do anything. Real measured
    # runtime is ~50-57s/cycle, so this is comfortably within a single run
    # finishing before the next one is due.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: ghal-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --no-audit --no-fund

      - name: Run GHAL scan
        run: node run.mjs
        env:
          GHAL_SINCE: '4'

      - name: Commit results
        run: |
          git config user.name "scoutgrid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # The seeds workflow commits to the same repo/branch on its own
            # schedule — rebase onto whatever landed since checkout started,
            # retrying once, so a near-simultaneous run from the other
            # workflow doesn't get this push rejected outright.
            pushed=0
            for attempt in 1 2 3 4 5 6 7 8; do
              git rebase --abort >/dev/null 2>&1 || true
              if git pull --rebase --quiet && git push; then
                pushed=1
                break
              fi
              backoff=$((attempt * 8))
              echo "push attempt $attempt failed, retrying in ${backoff}s..."
              sleep $backoff
            done
            # A failed rebase/push left stranded commits in THIS ephemeral
            # runner only — nothing reached GitHub. Silently continuing (the
            # old behavior) made the job report "success" despite publishing
            # nothing; the next scheduled run would just repeat the same
            # fresh/duplicate work forever with no visible sign anything was
            # wrong. Fail loudly instead.
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push scan results after 3 attempts"
              exit 1
            fi
          fi
